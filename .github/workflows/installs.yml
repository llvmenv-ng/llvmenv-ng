name: Installs

on:
  pull_request:
    branches: ["*"]
    paths:
      # Workflow file itself
      - '.github/workflows/installs.yml'
      # Rust files
      - '**.rs'
      # Cargo files
      - 'Cargo.toml'
  push:
    branches: ["main", "develop"]
    paths:
      # Workflow file itself
      - '.github/workflows/installs.yml'
      # Rust files
      - '**.rs'
      # Cargo files
      - 'Cargo.toml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Ignore all warnings
  CFLAGS: "-w -pipe"
  CXXFLAGS: "-w -pipe"

jobs:
  installs:
    name: Test LLVM
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        version:
          - llvm-mirror
          - 20.1.2
          - 20.1.1
          - 20.1.0
          - 19.1.7
          - 19.1.6
          - 19.1.5
          - 19.1.4
          - 19.1.3
          - 19.1.2
          - 19.1.1
          - 19.1.0
          - 18.1.8
          - 18.1.7
          - 18.1.6
          - 18.1.5
          - 18.1.4
          - 18.1.3
          - 18.1.2
          - 18.1.1
          - 18.1.0
          - 17.0.6
          - 17.0.5
          - 17.0.4
          - 17.0.3
          - 17.0.2
          - 17.0.1
          - 17.0.0
          - 16.0.6
          - 16.0.5
          - 16.0.4
          - 16.0.3
          - 16.0.2
          - 16.0.1
          - 16.0.0
          - 15.0.7
          - 15.0.6
          - 15.0.5
          - 15.0.4
          - 15.0.3
          - 15.0.2
          - 15.0.1
          - 15.0.0
          - 14.0.6
          - 14.0.5
          - 14.0.4
          - 14.0.3
          - 14.0.2
          - 14.0.1
          - 14.0.0
          - 13.0.1
          - 13.0.0
          - 12.0.1
          - 12.0.0
          - 11.1.0
          - 11.0.1
          - 11.0.0
          - 10.0.1
          - 10.0.0
          - 9.0.1
